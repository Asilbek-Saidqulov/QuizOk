<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — QuizOk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/quiz.css">
</head>
<body class="qz-page">

  <header class="qz-topbar">
    <div class="qz-topbar-inner">
      <a href="/?screen=home" class="qz-topbar-logo">QuizOk</a>
      <nav class="qz-topbar-nav">
        <a href="/?screen=home">Home</a>
        <a href="/discover.html">Discover</a>
        <a href="/?screen=join">Join a Game</a>
        <a href="/?screen=my-quizzes">My Quizzes</a>
        <a href="/?screen=teacher">Create Quiz</a>
      </nav>
    </div>
  </header>

  <!-- Loading Screen -->
  <div id="qzLoadingScreen" class="qz-screen qz-screen--loading">
    <div class="qz-loading">
      <div class="qz-spinner"></div>
      <p>Loading quiz...</p>
    </div>
  </div>

  <!-- Quiz Gameplay Screen -->
  <div id="qzGameplayScreen" class="qz-screen qz-screen--gameplay" style="display: none;">
    <div id="qzHeader"></div>
    
    <main class="qz-main">
      <div id="qzQuestionContainer"></div>
      <div id="qzOptionsContainer"></div>
      <div id="qzFeedbackContainer"></div>
      <div id="qzActionsContainer"></div>
    </main>
  </div>

  <!-- Results Screen -->
  <div id="qzResultsScreen" class="qz-screen qz-screen--results" style="display: none;">
    <div id="qzResultsContainer"></div>
  </div>

  <!-- Review Screen -->
  <div id="qzReviewScreen" class="qz-screen qz-screen--review" style="display: none;">
    <div id="qzReviewContainer"></div>
  </div>

  <!-- Scripts -->
  <script src="/js/discover/metaverse-state.js"></script>
  <script src="/js/quiz/xp-system.js"></script>
  <script src="/js/quiz/quiz-gameplay.js"></script>
  <script src="/js/quiz/quiz-api.js"></script>
  <script src="/js/quiz/quiz-components.js"></script>
  <script src="/js/quiz/quiz-app.js"></script>
</body>
</html>
